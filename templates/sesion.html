<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #f6fbff 0%, #eef6ff 100%);
    }

    .auth-card {
      max-width: 420px;
      border-width: 2px;
    }

    .brand-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f9cff, #2b6df6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(43, 109, 246, .18);
    }
  </style>
</head>

<body class="d-flex align-items-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card auth-card mx-auto shadow-sm rounded-4 border-primary">
          <div class="card-body p-4">
            <div class="d-flex align-items-center mb-3">
            
              <div>
                <h5 class="mb-0">Bienvenido de nuevo</h5>
                <small class="text-muted">Inicia sesión en tu cuenta</small>
              </div>
            </div>
            <form method ="POST" action ="/validasesion">
              <div clas="mb-3">
                <label for ="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email"
                value ="{{request.form.email if request.form}}" required>
          </div>
          <div class="mb-3">
            <label for="password" class="from-label">Contraseña</label>
            <input type="password" class="form-control" id="password" nombre="password" required>
            
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
        </div>

        <div class="text-center mt-3">
          <p>No tienes cuenta? <a href="/facebook">Registrate aqui</a></p> 
        <div class="text-center mt-3 small text-muted">Acceso seguro • Privacidad</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    

  </script>
</body>
